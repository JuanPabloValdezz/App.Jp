<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Evaluación</title>
  <meta name="theme-color" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app">

    <header class="app-header">
      <h1 class="sr-only">Evaluación</h1>

      <!-- Se muestra automáticamente cuando no hay conexión (quítale 'hidden' si quieres verlo siempre para probar) -->
      <div class="status" id="status" role="status" aria-live="polite" hidden>
        <div class="status__pill">
          <span class="ico ico--orange" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.3" fill="none" stroke-linecap="round">
              <circle cx="12" cy="12" r="8"/>
              <line x1="5" y1="19" x2="19" y2="5"/>
            </svg>
          </span>
          <span>Sin conexión</span>
        </div>
        <div class="status__off">
          <span class="ico ico--red" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 8.82a15 15 0 0 1 20 0"/>
              <path d="M5 12.859a10 10 0 0 1 14 0"/>
              <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
              <line x1="12" y1="20" x2="12.01" y2="20"/>
              <line x1="4" y1="4" x2="20" y2="20"/>
            </svg>
          </span>
          <span>Offline</span>
        </div>
      </div>

      <p class="count" id="count">Configuración</p>
      <div class="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__fill" id="fill"></div>
      </div>
    </header>

    <main>
      <!-- 1. Configuración -->
      <section id="setup" class="screen screen--scroll" aria-labelledby="setup-title">
        <h2 id="setup-title" class="title">Cargar preguntas</h2>
        <p class="small">La app busca automáticamente <code>preguntas.json</code> del servidor. También puedes pegar un JSON o subirlo manualmente:</p>
        <label class="sr-only" for="json">Preguntas en formato JSON</label>
        <textarea id="json" spellcheck="false"></textarea>
        <label class="sr-only" for="file">Subir archivo JSON</label>
        <input type="file" id="file" accept=".json,application/json">
        <h3 class="sec">Temas</h3>
        <div class="chips" id="chips"></div>
        <p class="small" id="info"></p>
        <button type="button" class="cta" id="start">Comenzar evaluación</button>
      </section>

      <!-- 2. Evaluación (Ajustada 100% a la pantalla sin scroll) -->
      <section id="quiz" class="screen hidden" aria-labelledby="q">
        <h2 id="q" class="title"></h2>
        <div id="opts" class="opts-list" role="radiogroup" aria-labelledby="q"></div>
        <div class="bottom-actions">
          <nav class="nav" aria-label="Navegación entre preguntas">
            <button type="button" id="ant">‹&nbsp;&nbsp;&nbsp;ANT</button>
            <button type="button" id="sig">SIG&nbsp;&nbsp;&nbsp;›</button>
          </nav>
          <button type="button" class="cta" id="fin">Finalizar Evaluación</button>
        </div>
      </section>

      <!-- 3. Resultado -->
      <section id="res" class="screen screen--scroll hidden" aria-labelledby="res-title">
        <h2 id="res-title" class="title">Resultado</h2>
        <p class="score" id="score"></p>
        <div id="rev" class="rev-list"></div>
        <button type="button" class="cta" id="again">Nueva evaluación</button>
      </section>
    </main>

  </div>
</body>
</html>
